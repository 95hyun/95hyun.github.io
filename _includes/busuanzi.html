<!-- Busuanzi 방문자수 통계 스크립트 -->
<script>
// Busuanzi 스크립트를 동적으로 로드
(function() {
  // 페이지가 완전히 로드된 후 실행
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadBusuanzi);
  } else {
    loadBusuanzi();
  }
  
  function loadBusuanzi() {
    var script = document.createElement('script');
    script.async = true;
    script.src = 'https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js';
    
    // 로드 실패 시 처리
    script.onerror = function() {
      var uvElement = document.getElementById('busuanzi_value_site_uv');
      var pvElement = document.getElementById('busuanzi_value_site_pv');
      if (uvElement) uvElement.textContent = '?';
      if (pvElement) pvElement.textContent = '?';
    };
    
    // 스크립트 로드 완료 후 체크
    script.onload = function() {
      setTimeout(function() {
        var uvElement = document.getElementById('busuanzi_value_site_uv');
        var pvElement = document.getElementById('busuanzi_value_site_pv');
        
        // 값이 업데이트되지 않았으면 0으로 설정
        if (uvElement && (uvElement.textContent === '-' || uvElement.textContent === '')) {
          uvElement.textContent = '1';
        }
        if (pvElement && (pvElement.textContent === '-' || pvElement.textContent === '')) {
          pvElement.textContent = '1';
        }
      }, 3000);
    };
    
    document.head.appendChild(script);
  }
})();
</script>

<style>
/* 방문자수 통계 스타일링 - Chirpy 테마 호환 */
.visitor-stats {
  border-top: 1px solid var(--sidebar-border-color, var(--border-color));
  font-size: 0.8rem;
}

.visitor-stats i {
  color: var(--text-muted-color);
  opacity: 0.7;
}

.visitor-stats small {
  color: var(--text-muted-color);
  font-weight: 400;
}

/* Busuanzi 값 스타일링 */
#busuanzi_value_site_uv, 
#busuanzi_value_site_pv {
  color: var(--text-color);
  font-weight: 500;
  min-width: 1rem;
  display: inline-block;
}

/* 로딩 상태 */
#busuanzi_value_site_uv:empty:before,
#busuanzi_value_site_pv:empty:before {
  content: "...";
  color: var(--text-muted-color);
  animation: loading 1.5s infinite;
}

@keyframes loading {
  0%, 60%, 100% { opacity: 1; }
  30% { opacity: 0.4; }
}

/* 반응형 - 모바일에서 더 작게 */
@media (max-width: 576px) {
  .visitor-stats {
    font-size: 0.75rem;
  }
  
  .visitor-stats i {
    font-size: 0.7rem;
  }
}
</style>
