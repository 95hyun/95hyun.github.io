<!-- Busuanzi 방문자수 통계 스크립트 -->
<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>

<!-- Busuanzi 로딩 체크 및 fallback -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  // Busuanzi 스크립트가 로드되었는지 확인
  function checkBusuanzi() {
    // 최대 10초 대기
    var maxAttempts = 20;
    var attempts = 0;
    
    var checkInterval = setInterval(function() {
      attempts++;
      
      // Busuanzi 객체가 로드되었거나 요소에 값이 업데이트되었는지 확인
      var uvElement = document.getElementById('busuanzi_value_site_uv');
      var pvElement = document.getElementById('busuanzi_value_site_pv');
      
      if (uvElement && pvElement) {
        // 실제 숫자 값이 들어왔는지 확인
        if (uvElement.textContent && uvElement.textContent !== '-' && uvElement.textContent !== '' && 
            pvElement.textContent && pvElement.textContent !== '-' && pvElement.textContent !== '') {
          clearInterval(checkInterval);
          return;
        }
      }
      
      // 최대 시도 횟수 초과 시 기본값 설정
      if (attempts >= maxAttempts) {
        clearInterval(checkInterval);
        if (uvElement && (uvElement.textContent === '-' || uvElement.textContent === '')) {
          uvElement.textContent = '1';
        }
        if (pvElement && (pvElement.textContent === '-' || pvElement.textContent === '')) {
          pvElement.textContent = '1';
        }
      }
    }, 500);
  }
  
  // 페이지 로드 후 즉시 체크 시작
  checkBusuanzi();
});
</script>

  opacity: 0.7;
}

  color: var(--text-muted-color);

}

#busuanzi_value_site_uv, 
#busuanzi_value_site_pv {
  color: var(--text-color);
  font-weight: 500;
  min-width: 1rem;
  display: inline-block;
}

/* 로딩 상태 */
#busuanzi_value_site_uv:empty:before,

</style>
